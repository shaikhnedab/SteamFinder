services:
  app:
    build: .
    image: steamfinder:latest
    container_name: steamfinder
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      APP_NAME: SteamFinder
      APP_ENV: production
      APP_DEBUG: "false"
      APP_LOCALE: ${APP_LOCALE:-en}
      # Required: export it first (or put it in a shell .env file next to this compose file).
      # Get a key at https://steamcommunity.com/dev/apikey
      STEAM_API_KEY: ${STEAM_API_KEY:?Set STEAM_API_KEY before running — e.g. STEAM_API_KEY=xxx docker compose up}
    # Availability boundary for docker/php.ini's memory_limit = -1 (php2shell
    # mitigation, CVE-2026-109618): a runaway request is contained at the
    # container level; restart: unless-stopped brings the service back.
    mem_limit: 256m
