; php2shell hardening — CVE-2026-109618 (RCE via OOM corruption) and
; CVE-2026-109619 (RCE via stale global state), fixed in PHP
; 8.2.35 / 8.3.36 / 8.4.27 / 8.5.12 (2026-10-21).
; Every setting below follows the PHP security advisory's mitigation list;
; updating the PHP version itself remains the only complete fix.
; Loaded for both CLI SAPI and the built-in server cli-server SAPI.
;
; [CVE-2026-109618] Remove the controllable memory-cap failure path.
; memory_limit = -1 cannot be overridden by application code here; the
; availability boundary is docker-compose.yml `mem_limit` instead. Do NOT
; replace this with RLIMIT_AS/RLIMIT_DATA (advisory: they cause the
; vulnerable allocation failure).
memory_limit = -1

; This app has no file uploads and no forms that submit large data.
; [CVE-2026-109618] Advisory: "For applications that don't require file
; uploads, set post_max_size = 8M" and disable uploads outright.
file_uploads = Off
post_max_size = 8M
upload_max_filesize = 2M
max_input_vars = 1000

; [CVE-2026-109619] Advisory: "Set session.upload_progress.enabled=0".
; Blocks the confirmed session-progress exploitation path.
session.upload_progress.enabled = 0

; [CVE-2026-109619] Blocks the confirmed fatal-backtrace path on PHP 8.5+.
; Unknown to PHP <= 8.4, which ignores unrecognized directives harmlessly.
fatal_error_backtraces = 0

; General hygiene
expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
max_execution_time = 60
